<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escher · Writing and design toolbars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="editor-bar" id="editor-bar">
  <svg class="eb-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M3 9h18M9 9v12"></path></svg>
  <strong>Site editor</strong>
  <span class="eb-mode" id="eb-mode" hidden></span>
  <span class="eb-hint" id="eb-hint"></span>
  <span class="spacer"></span>
  <label class="eb-switch" title="Show which WordPress block sits behind each piece of content">
    <input type="checkbox" id="show-blocks">
    <span class="eb-track" aria-hidden="true"></span>
    Show blocks
  </label>
  <button class="eb-btn" id="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
  <button class="eb-btn" id="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
  <button class="eb-btn" id="reset">Reset</button>
</header>

<main id="page" aria-label="Page"></main>

<div class="tb" id="tb" role="toolbar" hidden></div>
<div class="pop" id="pop" hidden></div>
<div class="drop-line" id="drop-line" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="ask" id="ask" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
