<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frankenthaler · Writing and design toolbars in WordPress</title>
<style>
  :root { --bar: #1E1E1E; --blue: #3858E9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #F4F2EE; color: #1A1A1A; font-family: system-ui, sans-serif; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 10px 16px; background: var(--bar); color: #fff; font-size: 14px;
  }
  .bar strong { font-size: 15px; }
  .bar .hint { color: #C7C7C7; }
  .bar .spacer { flex: 1; }
  .bar a {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border: 1px solid #5A5A5A; border-radius: 6px;
    color: #fff; text-decoration: none; font-size: 13px;
  }
  .bar a:hover, .bar a:focus-visible { border-color: #C7C7C7; outline: none; }
  .bar a.primary { background: var(--blue); border-color: var(--blue); font-weight: 600; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
  .narrow { display: none; }
  @media (max-width: 760px) {
    .bar .hint { display: none; }
    .narrow { display: block; padding: 10px 16px; background: #FFF4D6; color: #3B3016; font-size: 14px; line-height: 1.4; }
  }
</style>
</head>
<body>

<div class="bar">
  <strong>Frankenthaler</strong>
  <span class="hint">Escher’s writing and design toolbars, as a WordPress plugin. Click any text for the writing toolbar; click a button, picture or section for the design one.</span>
  <span class="spacer"></span>
  <a href="https://github.com/Automattic/site-editing-experiments/tree/trunk/frankenthaler#readme">About Frankenthaler</a>
  <a class="primary" id="full" href="#">Open full screen</a>
</div>
<p class="narrow">This runs a real WordPress editor, which needs a desktop browser and a wide window.</p>

<div class="stage">
  <iframe id="playground" title="WordPress Playground running Frankenthaler" allow="clipboard-read; clipboard-write"></iframe>
</div>

<script>
  // The same blueprint as the README's Playground link: Frankenthaler from this repo's
  // trunk, and a sample page open in the editor.
  var blueprint = 'https://raw.githubusercontent.com/Automattic/site-editing-experiments/trunk/frankenthaler/blueprint.json';
  var url = 'https://playground.wordpress.net/?mode=seamless&blueprint-url=' + encodeURIComponent( blueprint );
  document.getElementById( 'playground' ).src = url;
  document.getElementById( 'full' ).href = 'https://playground.wordpress.net/?blueprint-url=' + encodeURIComponent( blueprint );
</script>
</body>
</html>
